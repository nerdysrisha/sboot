# -----------------------------
# Customer Service Deployment + Service
# -----------------------------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: customer-deployment
  namespace: integrations
spec:
  replicas: 1
  selector:
    matchLabels:
      app: customer
  template:
    metadata:
      labels:
        app: customer
    spec:
      containers:
        - name: customer
          image: nerdysrisha/customer:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8081
          env:
            - name: JOB_SERVICE_URL
              value: "http://job-service:8082"

---
apiVersion: v1
kind: Service
metadata:
  name: customer-service
  namespace: integrations
spec:
  type: ClusterIP
  selector:
    app: customer
  ports:
    - protocol: TCP
      port: 8081
      targetPort: 8081
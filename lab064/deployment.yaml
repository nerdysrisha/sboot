apiVersion: apps/v1
kind: Deployment
metadata:
  name: hworld-deployment
  namespace: integrations
spec:
  replicas: 1
  selector:
    matchLabels:
      app: hworld
  template:
    metadata:
      labels:
        app: hworld
    spec:
      containers:
        - name: hworld
          image: nerdysrisha/hworld064:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: tmp-volume
              mountPath: /tmp
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            initialDelaySeconds: 60
            periodSeconds: 20
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            initialDelaySeconds: 40
            periodSeconds: 20
            timeoutSeconds: 2
            failureThreshold: 3
      volumes:
        - name: tmp-volume
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: hworld-service
  namespace: integrations
spec:
  type: NodePort
  selector:
    app: hworld
  ports:
    - protocol: TCP
      port: 8080
      targetPort: 8080
      nodePort: 30080

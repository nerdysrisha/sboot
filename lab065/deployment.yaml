apiVersion: apps/v1
kind: Deployment
metadata:
  name: analytics-deployment
  namespace: integrations
spec:
  replicas: 1
  selector:
    matchLabels:
      app: analytics
  template:
    metadata:
      labels:
        app: analytics
    spec:
      tolerations:
        - key: "app-key"
          operator: "Equal"
          value: "analytics"
          effect: "NoSchedule"
      containers:
        - name: analytics
          image: nerdysrisha/analytics065:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
          resources:
            requests:
              cpu: "500m"
              memory: "512Mi"
            limits:
              cpu: "2"
              memory: "2Gi"
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: tmp-volume
              mountPath: /tmp
      volumes:
        - name: tmp-volume
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: analytics-service
  namespace: integrations
spec:
  type: NodePort
  selector:
    app: analytics
  ports:
    - protocol: TCP
      port: 8080
      targetPort: 8080
      nodePort: 30080

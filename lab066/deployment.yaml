apiVersion: apps/v1
kind: Deployment
metadata:
  name: hpaenabledhw-deployment
  namespace: integrations
spec:
  replicas: 1
  selector:
    matchLabels:
      app: hpaenabledhw
  template:
    metadata:
      labels:
        app: hpaenabledhw
    spec:
      containers:
        - name: hpaenabledhw
          image: nerdysrisha/hpaenabledhw66:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
          resources:
            requests:
              cpu: "20m"
              memory: "128Mi"
            limits:
              cpu: "200m"
              memory: "256Mi"
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: tmp-volume
              mountPath: /tmp
      volumes:
        - name: tmp-volume
          emptyDir: {}

---
apiVersion: v1
kind: Service
metadata:
  name: hpaenabledhw-service
  namespace: integrations
spec:
  type: NodePort
  selector:
    app: hpaenabledhw
  ports:
    - protocol: TCP
      port: 8080
      targetPort: 8080
      nodePort: 30080

---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: hpaenabledhw-hpa
  namespace: integrations
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: hpaenabledhw-deployment
  minReplicas: 1
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 15  # Target average CPU usage across pods
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 5  # Only wait 5 seconds before scaling down
      policies:
        - type: Percent
          value: 100                # Allow full scale-down if needed
          periodSeconds: 10        # Evaluate every 10 seconds

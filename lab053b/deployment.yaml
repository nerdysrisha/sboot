apiVersion: apps/v1
kind: Deployment
metadata:
  name: payments53b-deployment
  namespace: integrations
spec:
  replicas: 1
  selector:
    matchLabels:
      app: payments53b
  template:
    metadata:
      labels:
        app: payments53b
    spec:
      containers:
        - name: payments53b
          image: nerdysrisha/payments53b:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: payments53b-service
  namespace: integrations
spec:
  type: NodePort
  selector:
    app: payments53b
  ports:
    - protocol: TCP
      port: 8080
      targetPort: 8080
      nodePort: 30080
